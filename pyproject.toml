[project]
name = "thegreatfirewallofchina"
version = "0.1.0"
description = "Sandbox and monitor for agents running Chinese models on your own compute."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gfw = "gfw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
